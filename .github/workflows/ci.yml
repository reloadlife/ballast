name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    # Ballast targets macOS 26 and needs the Xcode 26 toolchain (Swift 6.2+).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Smoke-test the binary
        # The admin-scan entry point measures a folder and writes a plist;
        # it exercises the walker without needing a window.
        run: |
          ./Ballast.app/Contents/MacOS/Ballast --admin-scan "$RUNNER_TEMP/walk.plist" "$GITHUB_WORKSPACE/Sources"
          plutil -lint "$RUNNER_TEMP/walk.plist"
